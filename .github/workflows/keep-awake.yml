name: Keep the site awake

# Render's free plan puts the site to sleep after 15 minutes without visitors.
# This loads the menu every 10 minutes so it stays awake; a failed run also
# shows that the site or its database is down.
#
# If the Render URL is not https://gigis-food-stall-i2ut.onrender.com, set it in
# GitHub: Settings > Secrets and variables > Actions > Variables > SITE_URL.
on:
  schedule:
    - cron: '*/10 * * * *'
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SITE_URL: ${{ vars.SITE_URL || 'https://gigis-food-stall-i2ut.onrender.com' }}
    steps:
      - name: Load the menu
        run: |
          for attempt in 1 2 3; do
            status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 90 "${SITE_URL%/}/api.php?action=menu" || true)
            echo "Attempt $attempt: HTTP $status"
            if [ "$status" = "200" ]; then
              exit 0
            fi
            sleep 20
          done
          echo "The site did not answer with 200 after 3 tries."
          exit 1
