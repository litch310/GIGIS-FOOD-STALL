# Render Blueprint: New > Blueprint in the Render dashboard, pick this repo.
# It creates the Postgres database and the web service and connects them.
# Values marked "sync: false" are asked for when the Blueprint is created.
databases:
  - name: gigis-food-house-db
    databaseName: gigis_food_house
    user: gigis
    # Render deletes free databases 30 days after they are created unless
    # they are upgraded to a paid plan.
    plan: free
    region: singapore

services:
  - type: web
    name: gigis-food-house
    runtime: node
    # Render's free plan blocks outgoing SMTP (ports 25, 465 and 587), so
    # verification and password reset emails cannot be sent from it. Choose
    # a paid instance type if customers need to sign up.
    plan: free
    region: singapore
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Internal connection string over Render's private network
      - key: DATABASE_URL
        fromDatabase:
          name: gigis-food-house-db
          property: connectionString
      - key: DATABASE_SSL
        value: disable
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: APP_TIMEZONE
        value: Asia/Manila
